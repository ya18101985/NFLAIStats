  workflow_dispatch:
    inputs:
      selftest:
        description: "Check the keys and send a test email first (true/false)"
        default: "true"

concurrency:
  group: bets          # never two runs at once (a queued run waits, then finds the wave done)
  cancel-in-progress: false

permissions:
  contents: write      # cloud_tick.py pushes the ledger and logs back to main

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NFAI_MAIL_KEY: ${{ secrets.NFAI_MAIL_KEY }}
    steps:
      - name: Check the Kalshi key is set
        id: keys
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20270216 ]; then
            echo "The 2026 season is over; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KALSHI_API_KEY_ID" ] || [ -z "$KALSHI_PRIVATE_KEY" ]; then
            echo "Kalshi secrets are not set yet; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.keys.outputs.ok == 'true'
        run: pip install -q -r requirements.txt

      - name: Self-test the keys (manual runs only)
        if: steps.keys.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.selftest != 'false'
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from nfai import odds, report
          from nfai.kalshi import Kalshi
          ok = True
          def check(name, fn):
              global ok
              try:
                  fn(); print(f"{name}: OK")
              except Exception as e:
                  ok = False; print(f"{name}: FAILED ({type(e).__name__}: {str(e)[:120]})")
          check("Kalshi login", lambda: Kalshi().balance())
          check("Sportsbook lines (The Odds API)", lambda: odds._get("/events"))
          check("Email", lambda: report.send("NFAI self-test", "<p>The automatic betting setup on GitHub can send email.</p>"))
          sys.exit(0 if ok else 1)
          EOF

      - name: Place any wave that is due
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "nfai-bot"
          git config user.email "nfai-bot@users.noreply.github.com"
          # the 10 AM and night waves top up in rounds; cloud_tick prints MORE while one has time left
          for round in $(seq 1 12); do
            python scripts/cloud_tick.py --live --window 60 > tick.raw 2>&1 || echo "Traceback: cloud_tick exited with an error" >> tick.raw
            grep -v 'skip ' tick.raw | tee tick.out || true
            cat tick.out >> tick.all
            [ "$(tail -n 1 tick.out)" = "MORE" ] || break
          done
          if grep -qE "WAVE FAILED|PUSH FAILED|Traceback" tick.all; then
            python scripts/alert.py "a betting wave failed" tick.all || true
          fi

      - name: Send settlement emails
        if: steps.keys.outputs.ok == 'true'
        run: |
          git pull -q --rebase origin main || true
          python - <<'EOF'
          import datetime as dt, sys
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          import emails
          today = dt.datetime.now(ZoneInfo("America/Los_Angeles")).date()
          for day in (today - dt.timedelta(days=2), today - dt.timedelta(days=1), today):
              try:
                  emails.settled(str(day), push=True)
              except Exception as e:
                  print(f"settlement email check failed for {day}: {e!r}")
          EOF

      - name: Email an alert if the run crashed
        if: failure()
        run: python scripts/alert.py "the betting run crashed" tick.all || true
