# Automatic betting on NFL game days through the Super Bowl (user's choice, 2026-11-12).
# Runs only on game days: two runs before each betting wave (20 and 8 minutes before its bet time),
# written from the NFL schedule by scripts/plan_runs.py (do not edit the cron lines by hand; rerun it).
# Each run places any wave due in the next 45 minutes (waiting until its bet time), commits the
# ledger, and exits in seconds when nothing is due (e.g. the second run after the first placed it).
# Kill switch: add a file named STOP at the repo root. Pause entirely: Actions tab > Bets > Disable.
name: Bets

on:
  schedule:
    - cron: "0 0 27 11 *"
    - cron: "7 0 13,17,20,24 11 *"
    - cron: "12 0 27 11 *"
    - cron: "25 0 16,23,30 11 *"
    - cron: "37 0 16,23,30 11 *"
    - cron: "35 13 15 11 *"
    - cron: "47 13 15 11 *"
    - cron: "40 16 26 11 *"
    - cron: "52 16 26 11 *"
    - cron: "25 17 15,22,29 11 *"
    - cron: "37 17 15,22,29 11 *"
    - cron: "40 18 27 11 *"
    - cron: "52 18 27 11 *"
    - cron: "10 20 26 11 *"
    - cron: "22 20 26 11 *"
    - cron: "30 20 15,22,29 11 *"
    - cron: "42 20 15,22,29 11 *"
    - cron: "55 20 15,22,29 11 *"
    - cron: "7 21 15,22,29 11 *"
    - cron: "40 23 25 11 *"
    - cron: "52 23 25 11 *"
    - cron: "55 23 12,16,19,23,30 11 *"
    - cron: "0 0 20 12 *"
    - cron: "7 0 1,4,8,11,15,18,22,25,26,29 12 *"
    - cron: "12 0 20 12 *"
    - cron: "25 0 7,14,21,28 12 *"
    - cron: "37 0 7,14,21,28 12 *"
    - cron: "40 16 25 12 *"
    - cron: "52 16 25 12 *"
    - cron: "25 17 6,13,20,27 12 *"
    - cron: "37 17 6,13,20,27 12 *"
    - cron: "10 20 25 12 *"
    - cron: "22 20 25 12 *"
    - cron: "30 20 6,13,20,27 12 *"
    - cron: "40 20 19 12 *"
    - cron: "42 20 6,13,20,27 12 *"
    - cron: "52 20 19 12 *"
    - cron: "55 20 6,13,20,27 12 *"
    - cron: "7 21 6,13,20,27 12 *"
    - cron: "55 23 3,7,10,14,17,21,24,25,28,31 12 *"
    - cron: "7 0 1,5,17,19,24 1 *"
    - cron: "20 0 18 1 *"
    - cron: "25 0 4,11 1 *"
    - cron: "32 0 18 1 *"
    - cron: "37 0 4,11 1 *"
    - cron: "25 17 3,10,17 1 *"
    - cron: "37 17 3,10,17 1 *"
    - cron: "25 19 24,31 1 *"
    - cron: "37 19 24,31 1 *"
    - cron: "10 20 9,16,23 1 *"
    - cron: "22 20 9,16,23 1 *"
    - cron: "30 20 3,10 1 *"
    - cron: "42 20 3,10 1 *"
    - cron: "55 20 3,10,17 1 *"
    - cron: "7 21 3,10,17 1 *"
    - cron: "35 22 24,31 1 *"
    - cron: "47 22 24,31 1 *"
    - cron: "40 23 9 1 *"
    - cron: "52 23 9 1 *"
    - cron: "55 23 4,16,18,23 1 *"
    - cron: "35 22 14 2 *"
    - cron: "47 22 14 2 *"
  workflow_dispatch:

concurrency:
  group: bets          # never two runs at once (a queued run waits, then finds the wave done)
  cancel-in-progress: false

permissions:
  contents: write      # cloud_tick.py pushes the ledger and logs back to main

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NFAI_MAIL_KEY: ${{ secrets.NFAI_MAIL_KEY }}
    steps:
      - name: Check the Kalshi key is set
        id: keys
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20270216 ]; then
            echo "The 2026 season is over; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KALSHI_API_KEY_ID" ] || [ -z "$KALSHI_PRIVATE_KEY" ]; then
            echo "Kalshi secrets are not set yet; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.keys.outputs.ok == 'true'
        run: pip install -q -r requirements.txt

      - name: Place any wave that is due
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "nfai-bot"
          git config user.email "nfai-bot@users.noreply.github.com"
          # the Sunday 10 AM wave tops up in rounds; cloud_tick prints MORE while it has time left
          for round in $(seq 1 12); do
            python scripts/cloud_tick.py --live --window 45 2>&1 | grep -v 'skip ' | tee tick.out
            [ "$(tail -n 1 tick.out)" = "MORE" ] || break
          done

      - name: Send settlement emails
        if: steps.keys.outputs.ok == 'true'
        run: |
          git pull -q --rebase origin main || true
          python - <<'EOF'
          import datetime as dt, sys
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          import emails
          today = dt.datetime.now(ZoneInfo("America/Los_Angeles")).date()
          for day in (today - dt.timedelta(days=2), today - dt.timedelta(days=1), today):
              try:
                  emails.settled(str(day), push=True)
              except Exception as e:
                  print(f"settlement email check failed for {day}: {e!r}")
          EOF
