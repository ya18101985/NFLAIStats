# Public Bet Tracker page that updates on its own on game days (user's request, 2026-11-14).
# Each run loops for up to 5 h 15 min (scripts/dash_live.py): every 2 minutes during games it rebuilds
# the dashboard and pushes its data to the `dashboard-live` branch; the page is served by GitHub Pages
# from the `gh-pages` branch and polls that data. Run times come from the NFL schedule via
# scripts/plan_runs.py (do not edit the cron lines by hand; rerun it).
name: Dashboard

on:
  schedule:
    - cron: "10 0 17,20,24 11 *"
    - cron: "55 2 27 11 *"
    - cron: "40 3 23,30 11 *"
    - cron: "50 4 16 11 *"
    - cron: "55 4 26 11 *"
    - cron: "10 5 17,20,24 11 *"
    - cron: "50 13 15 11 *"
    - cron: "55 16 26 11 *"
    - cron: "40 17 22,29 11 *"
    - cron: "50 18 15 11 *"
    - cron: "55 18 27 11 *"
    - cron: "55 21 26 11 *"
    - cron: "40 22 22,29 11 *"
    - cron: "50 23 15 11 *"
    - cron: "55 23 25,27 11 *"
    - cron: "10 0 1,4,8,11,15,18,22,25,29 12 *"
    - cron: "55 1 20 12 *"
    - cron: "55 2 26 12 *"
    - cron: "40 3 7,14,21,28 12 *"
    - cron: "10 5 1,4,8,11,15,18,22,25,29 12 *"
    - cron: "55 16 25 12 *"
    - cron: "40 17 6,13,20,27 12 *"
    - cron: "55 20 19 12 *"
    - cron: "55 21 25 12 *"
    - cron: "40 22 6,13,20,27 12 *"
    - cron: "10 0 1,5,19 1 *"
    - cron: "40 0 25 1 *"
    - cron: "25 1 10,17,24 1 *"
    - cron: "40 3 4,11,18 1 *"
    - cron: "10 5 1,5,19 1 *"
    - cron: "40 17 3,10,17 1 *"
    - cron: "40 19 24,31 1 *"
    - cron: "25 20 9,16,23 1 *"
    - cron: "40 22 3,10,17 1 *"
    - cron: "40 0 1 2 *"
    - cron: "50 22 14 2 *"
  workflow_dispatch:
    inputs:
      day:
        description: "Game day to show (YYYY-MM-DD); empty = today"
        default: ""
      minutes:
        description: "How long to keep updating"
        default: "315"

concurrency:
  group: dashboard     # one at a time; the next run waits for the previous one to finish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DAY: ${{ inputs.day }}
      MINUTES: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Keep the dashboard fresh
        run: |
          git config user.name "nfai-bot"
          git config user.email "nfai-bot@users.noreply.github.com"
          if [ "$(date -u +%Y%m%d)" -gt 20270216 ]; then echo "Season over."; exit 0; fi
          python scripts/dash_live.py $DAY --minutes "${MINUTES:-315}"
